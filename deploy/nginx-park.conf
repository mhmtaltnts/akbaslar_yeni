# Site ve API aynı adreste: client "/" altında statik dosya, backend "/api/"
# altında (nginx "/api" önekini atıp 127.0.0.1:3500'e iletir). Aynı adres
# olduğu için CORS gerekmez, refresh cookie'si birinci taraf cookie olur.
#
# Alan adı ve HTTPS gelince: server_name'e alan adı yazılır,
# `certbot --nginx -d ALAN_ADI` çalıştırılır ve backend .env'sinden
# COOKIE_SECURE=false satırı kaldırılır.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/park/client;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3500/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Backend'in login rate limiter'ı gerçek istemci IP'sini buradan okur
        # (TRUST_PROXY=true).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Vite derlemesindeki dosya adları içerik özetli: uzun süre önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tek sayfalık uygulama: bilinmeyen yollar index.html'e (yönlendirmeyi client yapar).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
